# GitHub Pages 배포와 오프라인 꾸러미 갱신.
#
# main에 밀 때마다 사이트를 빌드해 올리고, **같은 빌드**를 zip으로 묶어 고정 태그
# `offline` 릴리스에 갈아 끼운다. 둘을 한 워크플로에 둔 까닭은 같은 것을 배포하기
# 때문이다. 따로 두면 사이트와 내려받은 파일이 서로 다른 커밋을 가리키는 때가 생긴다.
# 릴리스는 배포가 성공해야 돌아간다 — 사이트는 그대로인데 내려받기만 새것이 되는
# 상황을 막는다.
#
# 태그를 `offline`으로 못 박아 두는 것은 **화면의 내려받기 링크가 바뀌지 않게** 하려는
# 것이다. 판마다 태그를 새로 달면 단추를 고칠 때마다 사람이 잊는다.
#
# 올리는 것은 빌드 산출물(dist)이고, 그 안은 index.html 한 장이다. 모든 코드와
# 스타일이 그 한 장에 들어 있어 압축을 해제해 더블클릭하면 인터넷 없이 열린다.
#
# 저장소 설정이 Settings → Pages → Source: GitHub Actions 여야 한다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나만 돌린다.
# 진행 중인 배포를 취소하지 않는다 — 중간에 끊으면 사이트가 반쯤 갱신된 채 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 검사가 하나라도 걸리면 사이트는 그대로 둔다
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 릴리스 잡이 같은 빌드를 묶도록 넘긴다 (다시 빌드하지 않는다)
      - name: Hand the build to the release job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Update the offline bundle
    needs: deploy # 배포가 성공한 뒤에만 올린다
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스를 만들고 갱신하는 데 필요하다

    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # 받는 사람이 처음 보는 것이 파일 두 개다. 무엇을 눌러야 하는지 적어 둔다
      - name: Zip the single-file build
        run: |
          cp dist/index.html "진학결과-분석기.html"
          cat > "읽어보세요.txt" <<'TXT'
          진학결과 분석기 — 오프라인용

          「진학결과-분석기.html」을 더블클릭하면 브라우저에서 바로 열립니다.
          설치할 것도, 인터넷도 필요하지 않습니다.

          불러온 자료는 그 브라우저 안에만 남고, 어디로도 나가지 않습니다.
          화면 위쪽 「자료 초기화」로 언제든 지울 수 있습니다.

          https://github.com/itmir913/admission-outcomes
          TXT
          zip "admission-outcomes-offline.zip" "진학결과-분석기.html" "읽어보세요.txt"

      - name: Upload to the fixed offline release
        uses: ncipollo/release-action@v1
        with:
          tag: offline
          artifacts: admission-outcomes-offline.zip
          allowUpdates: true # 있는 릴리스를 갱신한다
          replacesArtifacts: true # 옛 zip을 새것으로 바꾼다
          omitName: true # 릴리스 제목을 덮어쓰지 않는다
          omitBody: true # 릴리스 본문을 덮어쓰지 않는다
          token: ${{ secrets.GITHUB_TOKEN }}
